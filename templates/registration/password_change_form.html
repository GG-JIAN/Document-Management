<!doctype html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>修改我的密码</title>
<style>body{font-family:system-ui,sans-serif;max-width:700px;margin:3rem auto;padding:0 1rem;color:#202938}a{color:#155eef}label{display:block;font-weight:600;margin-top:1rem}input{box-sizing:border-box;width:100%;padding:.65rem;margin-top:.35rem;border:1px solid #b8c2cc;border-radius:.35rem}button{padding:.7rem 1rem;margin-top:1.2rem}.errorlist{color:#a4262c}</style></head>
<body>{% include "includes/user_toolbar.html" %}<nav><a href="{% url 'members:list' %}">总览与成员</a><a href="{% url 'catalog:projects' %}">项目</a><a href="{% url 'catalog:publications' %}">论文文献</a><a href="{% url 'catalog:patents' %}">专利</a><a href="{% url 'changes:list' %}">资料申请</a></nav><p><a href="{% url 'members:list' %}">返回系统首页</a></p><h1>修改我的密码</h1><p>请输入当前密码，再设置新密码。新密码会立即生效。</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}{{ field.errors }}{% endfor %}<button type="submit">确认修改</button></form>
</body></html>
